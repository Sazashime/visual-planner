<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Floor Planner | PLASIMA 99</title>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #444;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        #palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, 70px);
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        .tile-btn {
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }
        .tile-btn:hover {
            background: #eee;
        }
        .tile-btn.selected {
            border-color: #0078ff;
            background: #dcecff;
        }
        #preview {
            text-align: center;
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: crosshair;
        }
        #controls {
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 80px;
            padding: 4px;
            margin: 4px;
        }
        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background: #0078ff;
            color: white;
            border-radius: 6px;
            transition: background 0.2s;
        }
        button:hover {
            background: #005fcc;
        }
        #results {
            white-space: pre-wrap;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 10px;
            text-align: left;
            max-width: 400px;
        }
        #actions {
            text-align: center;
            margin-top: 20px;
        }
        .tip {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Визуален планер за PVC настилки | PLASIMA 99</h1>

    <div id="controls">
        <label>Ширина (m): <input type="number" id="width" step="0.1" value="4"></label>
        <label>Дължина (m): <input type="number" id="height" step="0.1" value="3"></label>
        <button id="generate">Генерирай</button>
        <button id="erase">Гума</button>
    </div>

    <div class="container">
        <div>
            <div id="palette"></div>
            <div id="preview">Изберете плочка</div>
        </div>

        <div id="canvas-container">
            <canvas id="gridCanvas" width="800" height="600"></canvas>

            <section id="actions">
                <button id="calculate">Изчисли</button>
                <button id="download">Изтегли HD изображение</button> <!-- ✅ NEW -->
                <div id="results" class="results"></div>
                <div class="tip">Съвет: добавете около 5% резерв за рязане и подравняване.</div>
            </section>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
